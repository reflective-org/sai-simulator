[pytest]
testpaths = tests
python_files = test_*.py
markers =
    s3_verification: one parametrized case per item (sequential in pytest; parallel via Celery)
    s3_verification_batch: all cases in one test (sequential; use Celery for parallel runs)
    s3_verification_celery: run verification via Celery task; pytest fails if task raises (use VALIDATION_CELERY_EAGER=1 without a worker)
    s3_verification_celery_batch: all cases via Celery in one test
