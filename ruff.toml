[lint]
# Pin pre-0.16 defaults so CI (unpinned ruff-action) and local stay aligned.
# Ruff 0.16 expanded defaults from ~59 to ~413 rules.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F403",  # wildcard imports (used throughout for constants/utils)
    "F405",  # may be undefined from star imports
    "F841",  # unused variables (often intentional in scientific code)
    "E722",  # bare except (legacy patterns)
    "E712",  # == True comparisons (xarray mask pattern)
]

[lint.per-file-ignores]
"launch_gradio.py" = ["F401"]
"variable_launch_gradio.py" = ["F401"]
"scripts/fit_delta.py" = ["F821"]  # variable referenced before assignment in conditional block
